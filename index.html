<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Workspace</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body >
    <!-- navbar -->
    <nav class="sticky top-0 z-50 bg-white shadow">
        <div class="w-6xl  m-auto p-3 flex justify-between">
            <h1 class="text-2xl font-bold">
            Project
            </h1>
            <ul class="items-center flex gap-8 text-gray-700 font-medium">
                <li><a class="hover:text-gray-900" href="#">Product</a></li>
                <li><a class="hover:text-gray-900" href="#">Solution</a></li>
                <li><a class="hover:text-gray-900" href="#">Resources</a></li>
                <li><a class="hover:text-gray-900" href="#">Pricing</a></li>
                <li><a class="hover:text-gray-900 text-black text" href="#">Log in</a></li>

                    <button class="bg-black text-white px-3 py-2 text-sm">Get AI Free</button>
            </ul>
        </div>
    </nav>
    <!-- hero -->
    <section class=" bg-linear-to-b from-orange-100 to-white">
        <div class="text-center w-5xl m-auto px-8">
            <h1 class="text-6xl font-bold leading-tight">Wite, plan, share.
                <br>
               <span> With AI at your side.</span>
            </h1>
            <p class="pt-2">It is the connected workspace where better, faster work happen. Now with AI.
            </p>
            <div class="mt-10 flex justify-center gap-3">
                <button class="bg-black text-white px-6 py-3 rounded text-sm">
                    Get AI Free → 
                </button>
                <button class="bg-blue-700 text-white px-6 py-3  rounded text-sm">
                    Request a Demo
                </button>
            </div>
        </div>

        <div class="relative mt-10">
            <img src="./workspace.avif" alt="workspace" class="absolute w-90 left-1/3">

            <!-- floating cards -->
            <div class="absolute top-10 left-20 bg-white shadow-xl p-5 w-64 z-20 rounded-xl ">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-orange-100 p-3">
                        📋
                    </div>
                    <div>
                        <h3 class="font-semibold text-lg">Task</h3>
                        <p class="text-gray-500 text-sm">12 tasks completed today</p>
                    </div>
                </div>
            </div>

            <div class="absolute top-6 right-20 bg-white shadow-xl p-3 w-60 z-20 rounded-xl ">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12  bg-green-100 p-3">
                        ✔️
                    </div>
                    <div>
                        <h3 class="font-semibold text-lg">Project Status</h3>
                        <p class="text-green-500 text-sm font-medium">On track</p>
                    </div>
                </div>
            </div>

            <div class="absolute top-35 right-40 bg-white shadow-xl p-5 w-72 z-20 rounded-xl ">
                <h3 class="font-semibold mb-4">Team Activity</h3>
                <div class="flex items-center">
                    <img src="./user-1.png" alt="user" class="w-10 h-10 rounded-full">
                    <img src="./user-2.png" alt="user" class="w-10 h-10 rounded-full">
                    <img src="./user-3.png" alt="user" class="w-10 h-10 rounded-full">
                    <span class="text-gray-600 font-medium">+5 Online</span>
                </div>
            </div>

        </div>
    </section>

    <div class="fixed bottom-6 right-6 z-50">
        <button class="w-14 h-14 rounded bg-black text-white shadow-2xl">
            💬
        </button>
    </div>
    
</body>
</html>
